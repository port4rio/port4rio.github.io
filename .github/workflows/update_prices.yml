name: Update Stock Prices

# いつ動かすかの設定
on:
  schedule:
    # 毎日 日本時間の 16:30 (UTCの 07:30) に実行
    # サーバー負荷を避けるため、中途半端な時間を推奨
    - cron: '30 7 * * *'
  workflow_dispatch: # 手動で実行できるボタンも追加しておく

jobs:
  update-prices:
    runs-on: ubuntu-latest # 最新の仮想サーバー（Linux）を使う

    # GitHubのファイル（prices.json）を上書きする権限を与える
    permissions:
      contents: write

    steps:
      # 1. 自分のリポジトリのコードを仮想サーバーに持ってくる
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Pythonの準備をする
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Python 3.10を使用

      # 3. yfinance (株価取得ツール) をインストールする
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      # 4. 株価取得のPythonスクリプトを実行する
      - name: Run fetch_prices.py
        run: python fetch_prices.py

      # 5. 更新された prices.json をGitHubに保存（コミット）する
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          # 変更がある場合のみ保存（コミット）する
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stock prices" && git push)
