name: Update Stock Prices

on:
  schedule:
    # 09:00〜11:15 まで15分おき（日本時間指定）
    - cron: '0,15,30,45 9,10 * * 1-5'
      timezone: "Asia/Tokyo"
    - cron: '0,15 11 * * 1-5'
      timezone: "Asia/Tokyo"
    # 12:30〜15:30 まで15分おき（日本時間指定）
    - cron: '30,45 12 * * 1-5'
      timezone: "Asia/Tokyo"
    - cron: '0,15,30,45 13,14,15 * * 1-5'
      timezone: "Asia/Tokyo"
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance jpholiday

      - name: Run fetch_prices.py
        run: python fetch_prices.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stock prices" && git push)

