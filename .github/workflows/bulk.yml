name: Run Bulk Fetch

on:
  workflow_dispatch:

# ▼ 追記：GitHub Actions にファイルの上書き保存（Push）を許可する
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-generativeai

      - name: Run bulk fetch script
        run: python3 bulk_fetch.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECRET_PROMPT: ${{ secrets.SECRET_PROMPT }} # ← 秘伝のプロンプトもセット

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ai_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update ai_news.json via bulk fetch" && git push)
