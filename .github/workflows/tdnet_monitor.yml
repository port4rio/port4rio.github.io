name: AI Earnings Monitor

on:
  schedule:
    - cron: '30 6 * * 1-5' # 平日15:30 (JST)
  workflow_dispatch: # 手動実行ボタン

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: リポジトリの取得
      uses: actions/checkout@v3

    - name: Pythonのセットアップ
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: ライブラリのインストール
      run: |
        pip install requests beautifulsoup4 pypdf google-generativeai

    - name: スクリプトの実行
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python monitor.py

    - name: ai_news.json をGitHubに保存
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ai_news.json
        git commit -m "Auto-update AI news [skip ci]" || exit 0
        git push
