name: AI Earnings Monitor

on:
  schedule:
    # 1-5時間遅れる
    - cron: '19 9 * * 1-5'
      timezone: 'Asia/Tokyo'
    - cron: '47 11 * * 1-5'
      timezone: 'Asia/Tokyo'
  workflow_dispatch: # 手動実行用

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: リポジトリの取得
      uses: actions/checkout@v5

    - name: Pythonのセットアップ
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: ライブラリのインストール
      run: |
        pip install requests beautifulsoup4 pypdf google-genai

    - name: スクリプトの実行
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SECRET_PROMPT: ${{ secrets.SECRET_PROMPT }}
      run: python monitor.py

    - name: ai_news.json をGitHubに保存
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ai_news.json schedule.json
        git commit -m "Auto-update AI news [skip ci]" || exit 0
        git push
