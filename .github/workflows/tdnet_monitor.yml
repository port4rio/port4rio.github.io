name: AI Earnings Monitor

on:
  schedule:
    # 完全に意表を突くマイナーな時間設定
    - cron: '52 2 * * 1-5'  # 11:53 (JST)
    - cron: '22 8 * * 1-5'  # 17:23 (JST)
  workflow_dispatch: # 手動実行用

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: リポジトリの取得
      uses: actions/checkout@v3

    - name: Pythonのセットアップ
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: ライブラリのインストール
      run: |
        pip install requests beautifulsoup4 pypdf google-generativeai

    - name: スクリプトの実行
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SECRET_PROMPT: ${{ secrets.SECRET_PROMPT }}
      run: python monitor.py

    - name: ai_news.json をGitHubに保存
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ai_news.json schedule.json
        git commit -m "Auto-update AI news [skip ci]" || exit 0
        git push
