<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>
<style>
  body { font-family: 'Helvetica Neue', Arial, sans-serif; padding: 20px; background-color: #f4f5f7; color: #333; }
  h1 { text-align: center; color: #2c3e50; }
  
  /* 入力エリアのカード */
  .input-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 30px; text-align: center; }
  .form-group { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
  input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; width: 150px; }
  button.add-btn { padding: 10px 20px; background-color: #1976d2; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
  button.add-btn:hover { background-color: #1565c0; }
  
  /* タイル（カード）を並べるグリッド設定 */
  .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
  
  /* 個別のタイルデザイン */
  .stock-tile { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; border-top: 4px solid #1976d2; }
  .tile-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
  .tile-code { font-size: 1.5em; font-weight: bold; color: #2c3e50; }
  .delete-btn { background-color: #e53935; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.9em; }
  .delete-btn:hover { background-color: #c62828; }
  
  /* タイル内の行 */
  .tile-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 15px; }
  .tile-label { color: #7f8c8d; }
  .tile-value { font-weight: bold; }
  
  /* プラス・マイナスの色 */
  .plus { color: #d32f2f; } /* 赤 */
  .minus { color: #388e3c; } /* 緑 */
  
  /* 合計エリア */
  .summary-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: right; font-size: 1.2em; }
  .summary-row { margin-bottom: 10px; }
  .summary-value { font-size: 1.5em; font-weight: bold; margin-left: 10px; }
</style>
</head>
<body>

<h1>📈 My Portfolio</h1>

<div class="input-card">
  <h3>新規銘柄の登録</h3>
  <div class="form-group">
    <input type="text" id="code" placeholder="銘柄コード (例: 7203)">
    <input type="number" id="shares" placeholder="株数 (例: 100)">
    <input type="number" id="price" placeholder="買値 (例: 1500)">
    <button class="add-btn" onclick="addStock()">追加する</button>
  </div>
</div>

<!-- ここにタイルが並びます -->
<div id="portfolio-grid" class="portfolio-grid">
</div>

<div class="summary-card">
  <div class="summary-row">合計評価額: <span class="summary-value" id="total-value">0円</span></div>
  <div class="summary-row">合計損益: <span class="summary-value" id="total-profit">0円</span></div>
</div>

<script>
  let portfolio = JSON.parse(localStorage.getItem('portfolio')) || [];
  let currentPrices = {};

  async function loadPrices() {
    try {
      // GitHub Actionsで更新された prices.json を読み込む
      const response = await fetch('prices.json');
      currentPrices = await response.json();
      renderTiles();
    } catch (error) {
      console.error("株価データの読み込みに失敗しました", error);
      renderTiles();
    }
  }

  function addStock() {
    const code = document.getElementById('code').value;
    const shares = parseFloat(document.getElementById('shares').value);
    const price = parseFloat(document.getElementById('price').value);

    if (code && shares && price) {
      portfolio.push({ code, shares, price });
      localStorage.setItem('portfolio', JSON.stringify(portfolio));
      document.getElementById('code').value = '';
      document.getElementById('shares').value = '';
      document.getElementById('price').value = '';
      renderTiles();
    } else {
      alert("すべての項目を入力してください。");
    }
  }

  function deleteStock(index) {
    if(confirm("この銘柄を削除しますか？")) {
      portfolio.splice(index, 1);
      localStorage.setItem('portfolio', JSON.stringify(portfolio));
      renderTiles();
    }
  }

  function renderTiles() {
    const grid = document.getElementById('portfolio-grid');
    grid.innerHTML = '';
    let totalValue = 0;
    let totalProfit = 0;

    portfolio.forEach((stock, index) => {
      const stockData = currentPrices[stock.code];
      const currentPrice = stockData ? stockData.price : null;
      const changeAmount = stockData ? stockData.change_amount : null;
      const changePercent = stockData ? stockData.change_percent : null;

      let currentPriceStr = '-';
      let changeStr = '-';
      let valueStr = '-';
      let profitStr = '-';
      let profitClass = '';
      let changeClass = '';

      if (currentPrice !== null) {
        currentPriceStr = currentPrice.toLocaleString() + '円';
        
        if (changeAmount !== null && changePercent !== null) {
            const sign = changeAmount > 0 ? '+' : '';
            changeStr = `${sign}${changeAmount.toLocaleString()}円 (${sign}${changePercent}%)`;
            changeClass = changeAmount > 0 ? 'plus' : (changeAmount < 0 ? 'minus' : '');
        }

        const value = currentPrice * stock.shares;
        const profit = (currentPrice - stock.price) * stock.shares;
        totalValue += value;
        totalProfit += profit;

        valueStr = value.toLocaleString() + '円';
        profitStr = (profit > 0 ? '+' : '') + profit.toLocaleString() + '円';
        profitClass = profit > 0 ? 'plus' : (profit < 0 ? 'minus' : '');
      }

      // タイル（カード）の生成
      const tile = document.createElement('div');
      tile.className = 'stock-tile';
      tile.innerHTML = `
        <div class="tile-header">
          <span class="tile-code">${stock.code}</span>
          <button class="delete-btn" onclick="deleteStock(${index})">削除</button>
        </div>
        <div class="tile-row"><span class="tile-label">現在値</span> <span class="tile-value">${currentPriceStr}</span></div>
        <div class="tile-row"><span class="tile-label">前日比</span> <span class="tile-value ${changeClass}">${changeStr}</span></div>
        <hr style="border: 0; border-top: 1px dashed #eee; margin: 12px 0;">
        <div class="tile-row"><span class="tile-label">買値</span> <span class="tile-value">${stock.price.toLocaleString()}円</span></div>
        <div class="tile-row"><span class="tile-label">保有株数</span> <span class="tile-value">${stock.shares.toLocaleString()}株</span></div>
        <div class="tile-row"><span class="tile-label">評価額</span> <span class="tile-value">${valueStr}</span></div>
        <div class="tile-row"><span class="tile-label">損益</span> <span class="tile-value ${profitClass}">${profitStr}</span></div>
      `;
      grid.appendChild(tile);
    });

    // 合計の更新
    document.getElementById('total-value').innerText = totalValue.toLocaleString() + '円';
    const totalProfitEl = document.getElementById('total-profit');
    totalProfitEl.innerText = (totalProfit > 0 ? '+' : '') + totalProfit.toLocaleString() + '円';
    totalProfitEl.className = 'summary-value ' + (totalProfit > 0 ? 'plus' : (totalProfit < 0 ? 'minus' : ''));
  }

  // 初回読み込み
  loadPrices();
</script>

</body>
</html>
