<style>

  /* ▼ AIニュース周りのCSS ▼ */

  .ai-bubble::before { content: ""; position: absolute; bottom: 15px; left: -7px; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-right: 7px solid #fff; }
  .ai-bubble-close { position: absolute; top: 4px; right: 6px; font-size: 12px; color: #999; cursor: pointer; background: none; border: none; }

    input[type="text"], input[type="number"], .calc-input, select { background-color: #2d2d2d; color: #fff; border-color: #444 !important; }
    .ai-news-container { background: linear-gradient(135deg, #1a2a3a, #111d27); border-left-color: #64b5f6; }
    .ai-news-container h2 { color: #64b5f6; }

    .stat-label, .tile-label { color: #bbb !important; }
    .schedule-info { color: #ffb74d !important; }

    .suggest-item { border-bottom-color: #444; }

    .delete-btn:hover { color: #eee; }
    .ai-news-summary { color: #ccc; }
    .ai-news-link { color: #64b5f6; }
    .plus { color: #66bb6a !important; }
    .minus { color: #ef5350 !important; }
    .load-more-btn { background: #2a3a4a; color: #64b5f6; }
    .load-more-btn:hover { background: #3a4a5a; }
    
    .ai-mascot { color: #ffcce0; text-shadow: 0 0 5px rgba(255, 204, 224, 0.7), 0 0 10px rgba(255, 204, 224, 0.3); }
    .ai-bubble { background: #1e1e1e; border-color: #444; color: #e0e0e0; text-shadow: none; }

    #ai-news-list { scrollbar-color: #555 transparent; scrollbar-width: thin; }

</style>

<body>

<h1>📈 Port<span class="brand-4">4</span>rio</h1>
<div id="toast"></div>

<!-- ▼ AIニュースコンテナ ▼ -->
<div id="ai-news-container" class="ai-news-container">
  <h2>
    <span style="display:flex; align-items:center; gap:6px;">
      ✨ AI決算サマリー
      <span id="ai-news-sort-btn" class="ai-news-toggle" onclick="toggleNewsSort()" style="margin-left: 8px;">⇅新着順</span>
    </span>
    <span id="ai-news-toggle" class="ai-news-toggle" onclick="toggleAINews()">▼広げる</span>
  </h2>
  <div id="ai-news-list"></div>
</div>

<!-- ▼ 銘柄登録フォーム ▼ -->
<div class="input-card">
  <div class="form-group">
    <div class="search-container">
      <input type="text" id="search-input" placeholder="銘柄コード/社名/ティッカー" autocomplete="off">
      <div id="suggest-box" class="suggest-box"></div>
    </div>
    <input type="number" id="shares" step="any" placeholder="株数">
    <input type="number" id="price" step="any" placeholder="買値">
    <button class="add-btn" onclick="addStock()">登録</button>
  </div>
</div>

<!-- ▼ ポートフォリオ一覧 ▼ -->
<div id="portfolio-grid" class="portfolio-grid"></div>

<!-- ▼ 全体サマリー ▼ -->
<div class="summary-card">
  <div class="summary-content">
    <div id="pie-chart" class="pie-chart" title="評価額の内訳"></div>
    <div class="summary-stats">
      <div>合計評価額: <span id="total-value">0円</span></div>
      <div>合計損益: <span id="total-profit">0円</span></div>
      <div>前日比: <span id="total-dod">0円 (+0.0%)</span></div>
      <button class="reload-btn" onclick="refreshAllPrices(true)">🔄 株価を最新に更新</button>
    </div>
  </div>
</div>

<!-- ▼ ツールエリア ▼ -->
<div class="summary-card" style="margin-bottom: 20px;">
  <div style="text-align: center; margin-bottom: 12px;">
    <span style="font-size: 13px; font-weight: bold; margin-right: 8px;">🔄 並べ替え:</span>
    <select id="sort-select" onchange="sortPortfolio()" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; outline: none;">
      <option value="default">選択してください</option>
      <option value="code">銘柄コード順</option>
      <option value="value">評価額が大きい順</option>
      <option value="profit_rate">損益率が高い順</option>
      <option value="dod_change">前日比(%)が高い順</option>
    </select>
  </div>
  <div class="tool-area-divider" style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; border-top: 1px dashed #eee; padding-top: 12px;">
    <button onclick="backupPortfolio()" style="padding: 6px 14px; background-color: #ff9800; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">💾 バックアップ</button>
    <button onclick="document.getElementById('restore-file').click()" style="padding: 6px 14px; background-color: #4CAF50; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">📂 読込</button>
    <input type="file" id="restore-file" accept=".json" style="display: none;" onchange="restorePortfolio(event)">
  </div>
</div>

<div class="footer-logo">
  <span onclick="window.scrollTo({top: 0, behavior: 'smooth'})">📈 Port<span class="brand-4">4</span>rio</span>
</div>

<div class="disclaimer">
  当サイトの情報は参考であり投資の最終判断は自己責任でお願いします。<br>
  取得している株価・決算予定・AI要約等の正確性は保証されません。
</div>

<!-- ▼ AI秘書 ▼ -->
<div id="ai-secretary" class="ai-secretary-container">
  <div class="ai-mascot" id="ai-mascot-img" onclick="toggleRobotSpeech()" title="クリックでセリフをオン/オフ">🤖</div>
  <div class="ai-bubble" id="ai-bubble">
    <button class="ai-bubble-close" onclick="closeSecretary()">✕</button>
    <span id="ai-secretary-text">読み込み中...</span>
    
    <div id="gemini-btn-area" style="display:none; margin-top: 10px; text-align: left; border-top: 1px dashed rgba(128,128,128,0.5); padding-top: 8px;">
      <a id="gemini-consult-btn" href="#" style="display: inline-block; padding: 6px 12px; background: linear-gradient(135deg, #1976d2, #8e24aa); color: #fff; text-decoration: none; border-radius: 12px; font-size: 11px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">🍥 ChatGPTに相談</a>
    </div>
  </div>
</div>

<script>
  let portfolio = JSON.parse(localStorage.getItem('portfolio')) || [];
  let currentPrices = {};
  let meigaraDict = {};
  let upcomingSchedule = {};
  let marketIndices = {};
  
  let secretaryPages = [];
  let secretaryPageIdx = 0;
  let secretaryTimeout = null;
  let currentTypewriterId = 0;
  let secLastVal = 0;
  let secLastProf = 0;
  
  // 0: 新着順, 1: 保有優先, 2: コア優先
  let newsSortMode = 0; 
  let aiNewsState = 1; 
  let isFetchingPrices = false; 
  let isSecretaryClosed = false; 
  
  let allNewsData = [];
  let currentNewsDisplayCount = 0;
  const NEWS_CHUNK_SIZE = 300;
  
  const coreStockCodes = [
    "7203", "8306", "9984", "285A", "6857", "8035", "8316", "6501", "6098", "9983",
    "6758", "8411", "6861", "8058", "8001", "9432", "9766", "8031", "2914", "6981",
    "7011", "4063", "6503", "4519", "9433", "7182", "9434", "7974", "6752", "5803",
    "8591", "6301", "7751", "6954", "4661", "4062", "2802", "9020", "8267", "6594",
    "1928", "6506"
  ];
  
  const CACHE_EXPIRE_MS = 3 * 60 * 1000;
  let lastNetworkRequestTime = 0;
  const pColors = ['#4e79a7', '#f28e2c', '#e15759', '#76b7b2', '#59a14f', '#edc949', '#af7aa1', '#ff9da7', '#9c755f', '#bab0ab', '#17becf', '#bcbd22'];

  function escapeHTML(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(match) {
      const escape = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      };
      return escape[match];
    });
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg; toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 3000);
  }

  function normalizeForSearch(str) {
    if (!str) return '';
    return str.replace(/[\s ]+/g, '').toUpperCase().replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/[\u3041-\u3096]/g, m => String.fromCharCode(m.charCodeAt(0) + 0x0060));
  }

  const searchInput = document.getElementById('search-input');
  const suggestBox = document.getElementById('suggest-box');

  searchInput.addEventListener('input', function() {
    const val = this.value.trim(); suggestBox.innerHTML = '';
    if (val.length >= 2) {
      const query = normalizeForSearch(val); let count = 0;
      for (const code in meigaraDict) {
        const d = meigaraDict[code];
        if (code.includes(query) || d.searchName.includes(query) || d.searchShortName.includes(query)) {
          const item = document.createElement('div');
          item.className = 'suggest-item'; item.innerText = `${code} ${d.shortName}`;
          item.onclick = function() { searchInput.value = `${code} ${d.shortName}`; suggestBox.style.display = 'none'; };
          suggestBox.appendChild(item); count++;
          if (count >= 100) break;
        }
      }
      suggestBox.style.display = count > 0 ? 'block' : 'none';
    } else { suggestBox.style.display = 'none'; }
  });

  document.addEventListener('click', e => { if (!searchInput.contains(e.target) && !suggestBox.contains(e.target)) suggestBox.style.display = 'none'; });

  async function loadDictionary() {
    try {
      const response = await fetch('jpx.csv');
      if(!response.ok) return;
      const buffer = await response.arrayBuffer();
      let text = new TextDecoder('shift_jis').decode(buffer);
      if (!text.includes('コード')) text = new TextDecoder('utf-8').decode(buffer);
      
      const lines = text.split('\n');
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
        let code = cols[0]; if (!code) continue;
        meigaraDict[code] = { 
          shortName: cols[2] || cols[1] || '', 
          searchName: normalizeForSearch(cols[1] || ''), 
          searchShortName: normalizeForSearch(cols[2] || cols[1] || '') 
        };
      }
    } catch (e) {}
  }

  async function fetchOnlinePrice(symbol, forceRefresh = false) {
    const isUs = /^[A-Za-z]+$/.test(symbol) && symbol !== 'JPY=X' && !symbol.startsWith('^');
    const targetSymbol = (isUs) ? symbol : ( /^[0-9A-Z]{4}$/.test(symbol) ? `${symbol}.T` : symbol );
    
    const cacheKey = `price_cache_${symbol}`;
    const cachedData = localStorage.getItem(cacheKey);
    if (!forceRefresh && cachedData) {
      try { const parsed = JSON.parse(cachedData); if (Date.now() - parsed.timestamp < CACHE_EXPIRE_MS) return parsed.data; } catch (e) {}
    }
    
    const nocache = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;
    const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${targetSymbol}?interval=1d&range=5d&_nc=${nocache}`;
    
    const MY_WORKER_URL = ""; 

    const proxies = [];
    if (MY_WORKER_URL) {
      proxies.push(url => `${MY_WORKER_URL}?url=${encodeURIComponent(url)}`);
    }
    
    proxies.push(
      url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
      url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
      url => `https://corsproxy.io/?${encodeURIComponent(url)}`
    );
    
    for (let getProxyUrl of proxies) {
      try {
        const elapsed = Date.now() - lastNetworkRequestTime;
        if (elapsed < 150) await new Promise(r => setTimeout(r, 150 - elapsed));
        lastNetworkRequestTime = Date.now();

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);

        const res = await fetch(getProxyUrl(targetUrl), { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!res.ok) continue;
        let rawJson = await res.json();
        
        let data = rawJson;
        if (rawJson && rawJson.contents) {
          try { data = typeof rawJson.contents === 'string' ? JSON.parse(rawJson.contents) : rawJson.contents; } catch(e) {}
        }

        const meta = data?.chart?.result?.[0]?.meta; if(!meta) continue;
        
        const marketTime = meta.regularMarketTime;
        if (marketTime) {
          const dataAgeHours = (Date.now() / 1000 - marketTime) / 3600;
          if (dataAgeHours > 72 && forceRefresh) continue;
        }

        const quotes = data.chart.result[0].indicators?.quote?.[0]?.close || [];
        const validCloses = quotes.filter(v => v !== null && v !== undefined && v !== 0);
        
        let currentPrice = meta.regularMarketPrice;
        if (currentPrice === undefined || currentPrice === null || currentPrice === 0) {
          if (validCloses.length > 0) currentPrice = validCloses[validCloses.length - 1];
        }

        let prevClose = null;
        if (validCloses.length >= 2) {
          prevClose = validCloses[validCloses.length - 2];
        } else if (meta.previousClose) {
          prevClose = meta.previousClose;
        }
        
        let changeAmount = null, changePercent = null;
        if (currentPrice !== undefined && currentPrice !== null && prevClose) {
          changeAmount = Math.round((currentPrice - prevClose) * 100) / 100;
          changePercent = Math.round((changeAmount / prevClose) * 10000) / 100;
        }
        
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        const priceResult = { price: currentPrice, change_amount: changeAmount, change_percent: changePercent, isUs: isUs, fetchTime: timeStr };
        localStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), data: priceResult }));
        return priceResult;
      } catch (e) {
        continue;
      }
    }
    if (cachedData) try { return JSON.parse(cachedData).data; } catch (e) {}
    return null;
  }

  async function addStock() {
    const searchVal = searchInput.value.trim();
    if(!searchVal) { showToast("銘柄を入力してください"); return; }
    
    let code = searchVal.toUpperCase();
    let name = '';

    const codeMatch = searchVal.match(/^([A-Za-z0-9]{1,5})/);
    
    if (codeMatch && meigaraDict[codeMatch[1].toUpperCase()]) {
      code = codeMatch[1].toUpperCase();
      name = meigaraDict[code].shortName;
    } else if (codeMatch && (/^\d{4}$/.test(codeMatch[1]) || /^[A-Za-z]+$/.test(codeMatch[1]))) {
      code = codeMatch[1].toUpperCase();
      name = code;
    } else {
      const query = normalizeForSearch(searchVal);
      let foundCode = null;
      
      for (const c in meigaraDict) {
        const d = meigaraDict[c];
        if (d.searchName === query || d.searchShortName === query || d.shortName === searchVal) {
          foundCode = c;
          break;
        }
      }
      if (!foundCode) {
        for (const c in meigaraDict) {
          const d = meigaraDict[c];
          if (d.searchName.includes(query) || d.searchShortName.includes(query)) {
            foundCode = c;
            break;
          }
        }
      }
      
      if (foundCode) {
        code = foundCode;
        name = meigaraDict[code].shortName;
      } else {
        showToast("該当する銘柄が見つかりませんでした");
        return;
      }
    }

    portfolio.push({ code, name, shares: parseFloat(document.getElementById('shares').value)||0, price: parseFloat(document.getElementById('price').value)||0 });
    localStorage.setItem('portfolio', JSON.stringify(portfolio));
    searchInput.value = ''; document.getElementById('shares').value = ''; document.getElementById('price').value = '';
    suggestBox.style.display = 'none'; showToast(`登録しました: ${code} ${name}`); renderTiles(); loadAINews();
    const data = await fetchOnlinePrice(code, true); if (data) { currentPrices[code] = data; renderTiles(); }
  }

  function calcTarget(index, buyPrice, shares, isUs) {
    const targetPrice = parseFloat(document.getElementById(`target-${index}`).value);
    const resultEl = document.getElementById(`target-result-${index}`);
    if (!shares || !buyPrice) { resultEl.innerText = '未設定'; resultEl.className = ''; return; }
    
    const usdRate = marketIndices['usdjpy']?.price || 155.0;
    if (targetPrice) {
      let profit = (targetPrice - buyPrice) * shares;
      if (isUs) profit *= usdRate; 
      resultEl.innerText = `${profit > 0 ? '+' : ''}${Math.round(profit).toLocaleString()}円`;
      resultEl.className = profit > 0 ? 'plus' : (profit < 0 ? 'minus' : '');
    } else { resultEl.innerText = '- 円'; resultEl.className = ''; }
  }

  function calcAverage(index, currentBuyPrice, currentShares, unitSymbol) {
      const addShares = parseFloat(document.getElementById(`add-shares-${index}`).value);
      const addPrice = parseFloat(document.getElementById(`add-price-${index}`).value);
      const resultEl = document.getElementById(`add-result-${index}`);
      if (!currentShares || !currentBuyPrice) { resultEl.innerText = '未設定'; return; }
      if (addShares && addPrice) {
          const totalCost = (currentBuyPrice * currentShares) + (addPrice * addShares);
          const totalShares = currentShares + addShares;
          const avgPrice = totalCost / totalShares;
          const isUs = unitSymbol === '$';
          const formatted = avgPrice.toLocaleString(undefined, {maximumFractionDigits: isUs ? 2 : 1});
          resultEl.innerText = isUs ? `$${formatted}` : `${formatted}円`;
      } else { resultEl.innerText = `- ${unitSymbol}`; }
  }

  function sortPortfolio() {
    const type = document.getElementById('sort-select').value;
    if (type === 'default') return;
    const usdRate = marketIndices['usdjpy']?.price || 155.0;
    
    portfolio.sort((a, b) => {
      const dataA = currentPrices[a.code] || {}; const dataB = currentPrices[b.code] || {};
      const isUsA = /^[A-Za-z]+$/.test(a.code); const isUsB = /^[A-Za-z]+$/.test(b.code);
      const priceA = (dataA.price || 0) * (isUsA ? usdRate : 1); 
      const priceB = (dataB.price || 0) * (isUsB ? usdRate : 1);
      
      if (type === 'code') return a.code.localeCompare(b.code); 
      else if (type === 'value') return (priceB * (b.shares || 0)) - (priceA * (a.shares || 0)); 
      else if (type === 'profit_rate') {
        const profA = a.price > 0 && dataA.price > 0 ? ((dataA.price - a.price) / a.price) : -9999;
        const profB = b.price > 0 && dataB.price > 0 ? ((dataB.price - b.price) / b.price) : -9999;
        return profB - profA;
      } else if (type === 'dod_change') {
        const dodA = dataA.change_percent || -9999; const dodB = dataB.change_percent || -9999;
        return dodB - dodA; 
      }
      return 0;
    });
    localStorage.setItem('portfolio', JSON.stringify(portfolio)); renderTiles();
    document.getElementById('sort-select').value = 'default'; showToast("並べ替えを適用しました");
  }

        <div class="ai-news-header" onclick="const b = this.nextElementSibling; b.style.display = b.style.display === 'block' ? 'none' : 'block';">
          <div class="ai-news-title" style="line-height: 1.4;">
            <span style="color: #7f8c8d; font-size: 0.85em; margin-right: 4px;">${shortDate}</span>
            ${badgeHtml}
            <span style="font-weight: bold; margin-right: 4px;">${stockName}</span>
            ${arrowHtml}
            <span style="font-weight: bold;">${displayTitle}</span>
          </div>
        </div>
        <div class="ai-news-body">
          <div class="ai-news-summary">${safeSummary}</div>
          <div style="margin-top: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
            <a href="${safeUrl}" target="_blank" class="ai-news-link" style="margin-top: 0;">📄 元のPDFを開く</a>
            <div class="share-wrapper" style="display: inline-flex; align-items: center; gap: 8px;">
              <button class="share-toggle-btn ai-news-link" style="margin-top: 0; background: none; border: none; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-family: inherit; font-weight: normal; font-size: 0.85em;">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92z"/></svg>
                <span>シェア</span>
              </button>
              <div class="share-icons" style="display: none; gap: 6px; align-items: center; font-size: 0.75em; font-weight: bold;">
                <a href="https://x.com/intent/tweet?text=${encodeURIComponent(fullText)}" target="_blank" style="text-decoration: none; color: inherit; border: 1px solid currentColor; padding: 2px 6px; border-radius: 4px; line-height: 1.2; display: inline-block;">𝕏</a>
                <a href="https://line.me/R/msg/text/?${encodeURIComponent(fullText)}" target="_blank" style="text-decoration: none; color: #00B900; border: 1px solid #00B900; padding: 2px 6px; border-radius: 4px; line-height: 1.2; display: inline-block;">LINE</a>
                <a href="https://www.threads.net/intent/post?text=${encodeURIComponent(fullText)}" target="_blank" style="text-decoration: none; color: inherit; border: 1px solid currentColor; padding: 2px 6px; border-radius: 4px; line-height: 1.2; display: inline-block;">Threads</a>
                <button class="copy-btn" style="background: none; border: 1px solid currentColor; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: inherit; font-weight: bold; color: inherit; line-height: 1.2; display: inline-block;">Copy</button>
              </div>
            </div>
          </div>
        </div>
      `;
      
      const shareToggle = card.querySelector('.share-toggle-btn');
      const shareIcons = card.querySelector('.share-icons');
      const copyBtn = card.querySelector('.copy-btn');
      
      shareToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        shareIcons.style.display = shareIcons.style.display === 'none' ? 'flex' : 'none';
      });

      copyBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        try {
          await navigator.clipboard.writeText(fullText);
          showToast("全文をコピーしました！");
        } catch(err) {}
      });

      list.appendChild(card);
    }

    if (endIndex < allNewsData.length) {
      const moreBtn = document.createElement('button');
      moreBtn.id = 'load-more-news-btn';
      moreBtn.className = 'load-more-btn';
      moreBtn.innerText = `さらに読み込む (残り ${allNewsData.length - endIndex} 件)`;
      moreBtn.onclick = function() {
        currentNewsDisplayCount += NEWS_CHUNK_SIZE;
        sortAndRenderNews(false);
      };
      list.appendChild(moreBtn);
    }
  }

  // ▼ AI秘書（アニメーション・判定・表示） ▼
  async function typeWriter(html, id) {
    const el = document.getElementById('ai-secretary-text'); if (!el) return;
    el.innerHTML = ''; let i = 0, isTag = false, text = '';
    
    while (i < html.length) {
      if (currentTypewriterId !== id || isSecretaryClosed) return; 
      let char = html.charAt(i); text += char;
      if (char === '<') isTag = true; if (char === '>') isTag = false;
      el.innerHTML = text; i++;
      if (!isTag && char !== '>') await new Promise(r => setTimeout(r, 30));
    }
  }

  async function playSecretaryLoop(id) {
    if (currentTypewriterId !== id || isSecretaryClosed || secretaryPages.length === 0) return;
    const html = secretaryPages[secretaryPageIdx];
    await typeWriter(html, id); 
    if (currentTypewriterId === id && !isSecretaryClosed) {
      secretaryTimeout = setTimeout(() => {
        secretaryPageIdx = (secretaryPageIdx + 1) % secretaryPages.length; 
        playSecretaryLoop(id);
      }, 3000);
    }
  }

  function closeSecretary() {
    isSecretaryClosed = true;
    document.getElementById('ai-bubble').style.display = 'none';
    const mascot = document.getElementById('ai-mascot-img');
    if (mascot) mascot.style.opacity = '0.5';
    clearTimeout(secretaryTimeout); currentTypewriterId++; 
  }

  function openSecretary() {
    isSecretaryClosed = false;
    document.getElementById('ai-bubble').style.display = 'block';
    const mascot = document.getElementById('ai-mascot-img');
    if (mascot) mascot.style.opacity = '1';
    updateAISecretary(secLastVal, secLastProf); 
  }

  function toggleRobotSpeech() {
    if (isSecretaryClosed) openSecretary();
    else closeSecretary();
  }

  function updateAISecretary(totalVal, totalProf) {
    secLastVal = totalVal; secLastProf = totalProf;
    if (isFetchingPrices) return;
    
    if (isSecretaryClosed) {
      document.getElementById('ai-secretary').style.display = 'flex';
      document.getElementById('ai-bubble').style.display = 'none';
      return;
    }

    clearTimeout(secretaryTimeout);
    currentTypewriterId++;
    const runId = currentTypewriterId;
    secretaryPages = []; secretaryPageIdx = 0;

    if (marketIndices['usdjpy'] || marketIndices['n225']) {
      let mHtml = `📊 <b>リアルタイム市況</b><br>`;
      
      if (marketIndices['n225']) {
        const d = marketIndices['n225'];
        const sign = d.change_amount > 0 ? '+' : '';
        mHtml += `日経平均 ${Math.round(d.price).toLocaleString()} (${sign}${d.change_amount} ${sign}${d.change_percent}%)<br>`;
      }
      
      if (marketIndices['usdjpy']) {
        const d = marketIndices['usdjpy'];
        mHtml += `ドル/円 ${d.price.toFixed(2)} <span style="font-size:0.85em; color:#7f8c8d;">(${d.fetchTime})</span><br>`;
      }
      
      if (marketIndices['sp500']) {
        const d = marketIndices['sp500'];
        const sign = d.change_amount > 0 ? '+' : '';
        mHtml += `S&P500 ${Math.round(d.price).toLocaleString()} (${sign}${d.change_percent}%)<br>`;
      }

      if (marketIndices['oil']) {
        const d = marketIndices['oil'];
        const sign = d.change_amount > 0 ? '+' : '';
        mHtml += `原油 $${d.price.toFixed(2)} (${sign}${d.change_percent}%)<br>`;
      }
      
      if (marketIndices['btc']) {
        const d = marketIndices['btc'];
        const sign = d.change_amount > 0 ? '+' : '';
        mHtml += `BTC $${Math.round(d.price).toLocaleString()} (${sign}${d.change_percent}%)<br>`;
      }
      
      secretaryPages.push(mHtml);
    }

    const hasAnyCost = portfolio.some(s => s.shares > 0 && s.price > 0);

    if (portfolio.length === 0) {
      secretaryPages.push("<b>Port4rio</b>へようこそ！<br>まずは上の検索窓から<br>銘柄を登録してみてね🤖");
      secretaryPages.push("銘柄を登録すると…<br>📅<b>決算発表</b>の予定を<br>自動でお知らせするよ！");
      secretaryPages.push("さらに！<br>あなたのポートフォリオを<br>🍥<b>AIに分析</b>してもらう<br>こともできちゃうんだ🤖");
    } else if (!hasAnyCost) {
      secretaryPages.push("登録ありがとう！<br>株数と買値を入力すると<br>損益を自動計算するよ📊");
      secretaryPages.push("ブラウザで記憶してるから<br>いつでもチェックできるよ。<br>🔖 ブックマークはお忘れなく！");
    } else {
      let earningsAlerts = [];
      portfolio.forEach(stock => {
        if (upcomingSchedule[stock.code]) earningsAlerts.push(`<b>${escapeHTML(stock.name) || escapeHTML(stock.code)}</b> (${upcomingSchedule[stock.code].date})`);
      });
      if (earningsAlerts.length > 0) secretaryPages.push(`📅 <b>決算接近中！</b><br>${earningsAlerts.join('<br>')}<br>発表が控えてるよ！🤖`);

      const usdRate = marketIndices['usdjpy']?.price || 155.0;
      let displayTotalVal = 0;
      let validStocks = portfolio.map((s, idx) => {
        const isUs = /^[A-Za-z]+$/.test(s.code);
        let price = (currentPrices[s.code] && currentPrices[s.code].price) ? currentPrices[s.code].price : s.price;
        let val = price * s.shares * (isUs ? usdRate : 1); 
        displayTotalVal += val;
        return { ...s, originalIndex: idx, val: val };
      }).filter(s => s.val > 0);
      
      validStocks.sort((a, b) => b.val - a.val);
      
      if (validStocks.length > 0) {
        let rankHtml = `👑 <b>評価額ランキング</b><br>`;
        const top5 = validStocks.slice(0, 5);
        top5.forEach(s => {
          const color = pColors[s.originalIndex % pColors.length];
          const percent = ((s.val / displayTotalVal) * 100).toFixed(1);
          const name = escapeHTML(s.name || meigaraDict[s.code]?.shortName || s.code);
          rankHtml += `<span style="color:${color};">●</span>${name} ${Math.floor(s.val).toLocaleString()}円 (${percent}%)<br>`;
        });
        secretaryPages.push(rankHtml);
      }
    }

    if (secretaryPages.length > 0) {
      document.getElementById('ai-secretary').style.display = 'flex';
      document.getElementById('ai-bubble').style.display = 'block';
      
      const geminiBtnArea = document.getElementById('gemini-btn-area');
      const geminiConsultBtn = document.getElementById('gemini-consult-btn');
      
      if (portfolio.length > 0) {
        let prompt = `私の保有株ポートフォリオを分析し、今日知るべきニュース、資産を増やす戦略を教えてください。見やすい配当金カレンダーも。\n`;
        prompt += `挨拶、前置きは不要です。回答の冒頭を必ず「あなたの [Port4rio]( https://port4rio.github.io ) を分析しました。」から始めてください。\n【保有株ポートフォリオ】\n`;
        portfolio.forEach(s => {
          const displayName = s.name || meigaraDict[s.code]?.shortName || s.code;
          const isUs = /^[A-Za-z]+$/.test(s.code);
          const unit = isUs ? '$' : '円';
          prompt += `・${s.code} ${displayName}`;
          
          const currentData = currentPrices[s.code];
          const currentPrice = (currentData && currentData.price) ? currentData.price : null;
          
          if (s.shares > 0 && s.price > 0) {
            prompt += `：${s.shares}株 (買値: ${unit}${s.price}`;
            if (currentPrice) prompt += ` / 現在値: ${unit}${currentPrice}`;
            prompt += `)`;
          } else {
            if (currentPrice) prompt += ` (現在値: ${unit}${currentPrice})`;
          }
          prompt += `\n`;
        });
 
        geminiConsultBtn.href = "https://chatgpt.com/?q=" + encodeURIComponent(prompt);
        geminiConsultBtn.target = '_blank';
        geminiConsultBtn.rel = 'noopener';
        geminiBtnArea.style.display = 'block';
      } else {
        geminiBtnArea.style.display = 'none';
      }
      playSecretaryLoop(runId);
    }
  }

  // ▼ 高速初期化処理 ▼
  async function init() {
    renderTiles();
    
    await loadDictionary();
    try {
      const res = await fetch('schedule.json?t=' + new Date().getTime());
      if (res.ok) upcomingSchedule = await res.json();
    } catch(e) {}
    
    renderTiles();
    loadAINews();

    refreshAllPrices(false);
  }

  init();
</script>
