<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Port4rio</title>
<style>
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: #f4f6f9;
    color: #333;
    margin: 0;
    padding: 15px;
  }
  h1 { text-align: center; color: #2c3e50; font-size: 1.5em; }
  
  /* ▼ AIニュース周りのCSS ▼ */
  .ai-news-container { background: linear-gradient(135deg, #f0f7ff, #e6f0fa); border-left: 5px solid #1976d2; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: none; }
  .ai-news-container h2 { margin-top: 0; font-size: 1.1em; color: #1976d2; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .ai-news-toggle { font-size: 0.8em; color: #666; cursor: pointer; font-weight: normal; padding: 4px; }
  
  #ai-news-list { overflow-y: auto; padding-right: 5px; transition: max-height 0.3s ease-in-out; }
  
  .ai-news-card { background: #fff; padding: 12px; border-radius: 6px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  
  .ai-news-header { cursor: pointer; display: flex; flex-direction: column; gap: 4px; user-select: none; }
  .ai-news-meta { font-size: 0.85em; color: #7f8c8d; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .badge-owned { background: #ff9800; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
  .ai-news-title { font-weight: bold; font-size: 1em; color: #2c3e50; line-height: 1.3; }
  
  .ai-news-body { display: none; padding-top: 10px; margin-top: 8px; border-top: 1px dashed #eee; }
  .ai-news-summary { font-size: 0.9em; color: #444; line-height: 1.6; white-space: pre-wrap; }
  .ai-news-link { display: inline-block; margin-top: 8px; font-size: 0.85em; color: #1976d2; text-decoration: none; }
  
  /* ▼ 銘柄追加フォーム ▼ */
  .input-card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; justify-content: center; }
  .form-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; width: 100%; justify-content: center;}
  
  input[type="text"], input[type="number"] { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
  .search-container { position: relative; width: 100%; max-width: 240px; }
  #search-input { width: 100%; }
  .suggest-box { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #ccc; border-radius: 4px; max-height: 200px; overflow-y: auto; z-index: 1000; display: none; }
  .suggest-item { padding: 8px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
  
  #shares { width: 80px; }
  #price { width: 100px; }
  button.add-btn { padding: 8px 20px; background-color: #1976d2; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; white-space: nowrap; }
  
  /* ▼ ポートフォリオのタイル一覧 ▼ */
  .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
  .stock-tile { background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border-top: 4px solid #1976d2; position: relative; display: flex; flex-direction: column; }
  
  .tile-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 12px; padding-right: 24px; }
  .title-group { display: flex; align-items: baseline; gap: 6px; overflow: hidden; flex: 1; padding-right: 5px; }
  .tile-code { font-size: 0.85em; color: #7f8c8d; flex-shrink: 0; }
  .tile-name { font-size: 1.1em; font-weight: bold; color: #2c3e50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
  .color-dot { font-size: 0.9em; margin-right: 2px; }
  
  .schedule-info { font-size: 11px; color: #ff9800; font-weight: bold; text-align: right; line-height: 1.3; flex-shrink: 0; }
  
  .delete-btn { position: absolute; top: 12px; right: 8px; background: transparent; border: none; font-size: 14px; color: #999; cursor: pointer; padding: 4px; line-height: 1; z-index: 10; }
  .delete-btn:hover { color: #333; }
  
  .tile-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; align-items: center; }
  .tile-label { color: #7f8c8d; }
  .tile-value { font-weight: bold; }
  .plus { color: #388e3c !important; } .minus { color: #d32f2f !important; }
  
  .details-btn { text-align: center; font-size: 12px; color: #1976d2; margin-top: 10px; cursor: pointer; background: #f0f7ff; padding: 6px; border-radius: 4px; }
  .details-content { display: none; margin-top: 10px; border-top: 1px dashed #eee; padding-top: 10px; }
  
  .details-stats { display: flex; justify-content: space-between; background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 10px; text-align: center; }
  .stat-item { display: flex; flex-direction: column; gap: 4px; flex: 1; } /* ← flex:1 を復活させて均等配置 */
  .stat-label { font-size: 11px; color: #7f8c8d; }
  .stat-value { font-size: 12px; font-weight: bold; color: #2c3e50; word-break: break-all; }
  
  .calc-area { background: #f8f9fa; padding: 10px; border-radius: 4px; font-size: 12px; }
  .calc-row { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; justify-content: space-between; }
  .calc-row:last-child { margin-bottom: 0; }
  input[type="number"].calc-input { 
    width: 60px;             /* 6桁が余裕で入る幅 */
    padding: 3px 4px;        /* 上下3px、左右4pxの小さな余白（全体設定を上書き） */
    font-size: 12px;         /* 文字サイズを小さく */
    height: auto;            /* 縦幅をリセット */
    border: 1px solid #ccc; 
    border-radius: 4px; 
    text-align: right; 
    box-sizing: border-box; 
  }
  
  /* ▼ フッター・サマリー周り ▼ */
  .summary-card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .summary-content { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }
  .pie-chart { width: 90px; height: 90px; border-radius: 50%; background: conic-gradient(#eee 0 100%); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  .summary-stats { display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: bold; align-items: flex-start; }
  .reload-btn { padding: 6px 14px; background-color: #1976d2; color: #fff; border: none; border-radius: 4px; font-size: 12px; margin-top: 4px; width: 100%; cursor: pointer;}
  
  .disclaimer { font-size: 10px; color: #999; text-align: center; margin-top: 40px; margin-bottom: 20px; line-height: 1.5; }
  
  #toast { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #323232; color: #fff; padding: 10px 20px; border-radius: 6px; z-index: 9999; font-size: 13px; }
  .footer-logo { text-align: center; margin-top: 40px; margin-bottom: -20px; }
  .footer-logo span { cursor: pointer; font-size: 1.2em; font-weight: bold; color: #1976d2; display: inline-block; padding: 10px; user-select: none; }
  
  /* ▼ ダークモード対応とAI秘書のデザイン ▼ */
  .ai-secretary-container { position: fixed; bottom: 15px; left: 15px; z-index: 1000; display: flex; align-items: flex-end; gap: 10px; max-width: calc(100vw - 30px); pointer-events: none; }
  .ai-mascot { width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; font-size: 35px; pointer-events: auto; cursor: pointer; transition: transform 0.2s; background: transparent; border: none;}
  .ai-mascot:active { transform: scale(0.9); }
  .ai-bubble { background: #fff; padding: 12px 25px 12px 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); font-size: 13px; position: relative; border: 1px solid #eee; pointer-events: auto; line-height: 1.5; }
  .ai-bubble::before { content: ""; position: absolute; bottom: 15px; left: -7px; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-right: 7px solid #fff; }
  .ai-bubble-close { position: absolute; top: 4px; right: 6px; font-size: 12px; color: #999; cursor: pointer; background: none; border: none; }
  
  @media (prefers-color-scheme: dark) {
    body { background-color: #121212; color: #e0e0e0; color-scheme: dark; }
    h1, .tile-name, .ai-news-title, .footer-logo span { color: #ffffff !important; }
    .input-card, .stock-tile, .summary-card, .ai-news-card, .suggest-box { background-color: #1e1e1e !important; box-shadow: 0 2px 8px rgba(255,255,255,0.02); }
    input[type="text"], input[type="number"], .calc-input, select { background-color: #2d2d2d; color: #fff; border-color: #444 !important; }
    .ai-news-container { background: linear-gradient(135deg, #1a2a3a, #111d27); border-left-color: #64b5f6; }
    .ai-news-container h2 { color: #64b5f6; }
    .ai-news-toggle { color: #bbb; }
    .tile-header, .details-content, .ai-news-body, .tool-area-divider { border-color: #444 !important; }
    .details-stats, .calc-area { background-color: #2a2a2a; }
    .stat-label, .tile-label, .ai-news-meta { color: #bbb !important; }
    .schedule-info { color: #ffb74d !important; }
    .stat-value, .tile-value { color: #e0e0e0; }
    .suggest-item { border-bottom-color: #444; }
    .suggest-item:hover { background-color: #333; }
    .delete-btn { color: #888; }
    .delete-btn:hover { color: #eee; }
    .details-btn { background: #2a3a4a; color: #64b5f6; }
    .ai-news-summary { color: #ccc; }
    .ai-news-link { color: #64b5f6; }
    .plus { color: #66bb6a !important; }
    .minus { color: #ef5350 !important; }
    
    /* ▼ ロボットの顔ネオン発光 ＆ セリフの通常表示 ▼ */
    .ai-mascot { color: #ffcce0; text-shadow: 0 0 5px rgba(255, 204, 224, 0.7), 0 0 10px rgba(255, 204, 224, 0.3); }
    .ai-bubble { background: #1e1e1e; border-color: #444; color: #e0e0e0; text-shadow: none; }
    .ai-bubble::before { border-right-color: #1e1e1e; }
    
    /* ▼ AIサマリー専用ダークスクロールバー ▼ */
    #ai-news-list { scrollbar-color: #555 transparent; scrollbar-width: thin; }
    #ai-news-list::-webkit-scrollbar { width: 6px; }
    #ai-news-list::-webkit-scrollbar-track { background: transparent; }
    #ai-news-list::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
    #ai-news-list::-webkit-scrollbar-thumb:hover { background: #777; }
  }
</style>
</head>
<body>

<h1>📈 Port4rio</h1>
<div id="toast"></div>

<!-- ▼ AIニュースコンテナ ▼ -->
<div id="ai-news-container" class="ai-news-container">
  <h2>
    <span style="display:flex; align-items:center; gap:6px;">
      ✨ AI決算サマリー
      <span id="ai-news-sort-btn" class="ai-news-toggle" onclick="toggleNewsSort()" style="margin-left: 8px;">⇅新着順</span>
    </span>
    <span id="ai-news-toggle" class="ai-news-toggle" onclick="toggleAINews()">▼広げる</span>
  </h2>
  <div id="ai-news-list"></div>
</div>

<!-- ▼ 銘柄登録フォーム ▼ -->
<div class="input-card">
  <div class="form-group">
    <div class="search-container">
      <input type="text" id="search-input" placeholder="辞書を準備中..." autocomplete="off">
      <div id="suggest-box" class="suggest-box"></div>
    </div>
    <input type="number" id="shares" step="100" placeholder="株数">
    <input type="number" id="price" placeholder="買値(円)">
    <button class="add-btn" onclick="addStock()">登録</button>
  </div>
</div>

<!-- ▼ ポートフォリオ一覧 ▼ -->
<div id="portfolio-grid" class="portfolio-grid"></div>

<!-- ▼ 全体サマリー ▼ -->
<div class="summary-card">
  <div class="summary-content">
    <div id="pie-chart" class="pie-chart" title="評価額の内訳"></div>
    <div class="summary-stats">
      <div>合計評価額: <span id="total-value">0円</span></div>
      <div>合計損益: <span id="total-profit">0円</span></div>
      <div>前日比: <span id="total-dod">0円 (+0.0%)</span></div>
      <button class="reload-btn" onclick="refreshAllPrices(true)">🔄 株価を最新に更新</button>
    </div>
  </div>
</div>

<!-- ▼ ツールエリア（並べ替え・バックアップ） ▼ -->
<div class="summary-card" style="margin-bottom: 20px;">
  <div style="text-align: center; margin-bottom: 12px;">
    <span style="font-size: 13px; font-weight: bold; margin-right: 8px;">🔄 並べ替え:</span>
    <select id="sort-select" onchange="sortPortfolio()" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; outline: none;">
      <option value="default">選択してください</option>
      <option value="code">銘柄コード順</option>
      <option value="value">評価額が大きい順</option>
      <option value="profit_rate">損益率が高い順</option>
      <option value="dod_change">前日比(%)が高い順</option>
    </select>
  </div>
  <div class="tool-area-divider" style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; border-top: 1px dashed #eee; padding-top: 12px;">
    <button onclick="backupPortfolio()" style="padding: 6px 14px; background-color: #ff9800; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">💾 バックアップ</button>
    <button onclick="document.getElementById('restore-file').click()" style="padding: 6px 14px; background-color: #4CAF50; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">📂 読込</button>
    <input type="file" id="restore-file" accept=".json" style="display: none;" onchange="restorePortfolio(event)">
  </div>
</div>

<div class="footer-logo">
  <span onclick="window.scrollTo({top: 0, behavior: 'smooth'})">📈 Port4rio</span>
</div>

<div class="disclaimer">
  当サイトの情報は参考であり投資の最終判断は自己責任でお願いします。<br>
  取得している株価・決算予定・AI要約等の正確性は保証されません。
</div>

<!-- ▼ AI秘書（フローティング） ▼ -->
<div id="ai-secretary" class="ai-secretary-container">
  <div class="ai-mascot" id="ai-mascot-img" onclick="openSecretary()">🤖</div>
  <div class="ai-bubble" id="ai-bubble">
    <button class="ai-bubble-close" onclick="closeSecretary()">✕</button>
    <span id="ai-secretary-text">読み込み中...</span>
    
    <!-- ▼ AI相談ボタン ▼ -->
    <div id="gemini-btn-area" style="display:none; margin-top: 10px; text-align: left; border-top: 1px dashed rgba(128,128,128,0.5); padding-top: 8px;">
      <a id="gemini-consult-btn" href="#" style="display: inline-block; padding: 6px 12px; background: linear-gradient(135deg, #1976d2, #8e24aa); color: #fff; text-decoration: none; border-radius: 12px; font-size: 11px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">🍥 ChatGPTに相談</a>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // ▼ 共通変数と基本設定 ▼
  // ==========================================
  let portfolio = JSON.parse(localStorage.getItem('portfolio')) || [];
  let currentPrices = {};
  let meigaraDict = {};
  let upcomingSchedule = {};
  
  // AI秘書・AIニュース制御用
  let secretaryPages = [];
  let secretaryPageIdx = 0;
  let secretaryTimeout = null;
  let currentTypewriterId = 0;
  let secLastVal = 0;
  let secLastProf = 0;
  let isNewsSortOwned = false; 
  let aiNewsState = 1; 
  let isFetchingPrices = false; 
  let isSecretaryClosed = false; 
  
  const CACHE_EXPIRE_MS = 5 * 60 * 1000;
  let lastNetworkRequestTime = 0;
  const pColors = ['#4e79a7', '#f28e2c', '#e15759', '#76b7b2', '#59a14f', '#edc949', '#af7aa1', '#ff9da7', '#9c755f', '#bab0ab', '#17becf', '#bcbd22'];

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg; toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 3000);
  }

  function normalizeForSearch(str) {
    if (!str) return '';
    return str.replace(/[\s ]+/g, '').toUpperCase().replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/[\u3041-\u3096]/g, m => String.fromCharCode(m.charCodeAt(0) + 0x0060));
  }

  // ==========================================
  // ▼ 銘柄検索と辞書読み込み ▼
  // ==========================================
  const searchInput = document.getElementById('search-input');
  const suggestBox = document.getElementById('suggest-box');

  searchInput.addEventListener('input', function() {
    const val = this.value.trim(); suggestBox.innerHTML = '';
    if (val.length >= 2) {
      const query = normalizeForSearch(val); let count = 0;
      for (const code in meigaraDict) {
        const d = meigaraDict[code];
        if (code.includes(query) || d.searchName.includes(query) || d.searchShortName.includes(query)) {
          const item = document.createElement('div');
          item.className = 'suggest-item'; item.innerText = `${code} ${d.shortName}`;
          item.onclick = function() { searchInput.value = `${code} ${d.shortName}`; suggestBox.style.display = 'none'; };
          suggestBox.appendChild(item); count++;
          if (count >= 100) break;
        }
      }
      suggestBox.style.display = count > 0 ? 'block' : 'none';
    } else { suggestBox.style.display = 'none'; }
  });

  document.addEventListener('click', e => { if (!searchInput.contains(e.target) && !suggestBox.contains(e.target)) suggestBox.style.display = 'none'; });

  async function loadDictionary() {
    try {
      const response = await fetch('jpx.csv');
      if(!response.ok) return;
      const buffer = await response.arrayBuffer();
      let text = new TextDecoder('shift_jis').decode(buffer);
      if (!text.includes('コード')) text = new TextDecoder('utf-8').decode(buffer);
      
      const lines = text.split('\n');
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
        // 1列目(0)がコード、2列目(1)が名称、3列目(2)が略称
        let code = cols[0]; if (!code) continue;
        meigaraDict[code] = { 
          shortName: cols[2] || cols[1] || '', 
          searchName: normalizeForSearch(cols[1] || ''), 
          searchShortName: normalizeForSearch(cols[2] || cols[1] || '') 
        };
      }
      searchInput.placeholder = "銘柄検索 (2文字以上)";
    } catch (e) { searchInput.placeholder = "辞書読込エラー"; }
  }

  // ==========================================
  // ▼ 株価取得とポートフォリオ管理 ▼
  // ==========================================
async function fetchOnlinePrice(code, forceRefresh = false) {
    const cacheKey = `price_cache_${code}`;
    const cachedData = localStorage.getItem(cacheKey);
    // 更新ボタン(forceRefresh)が押されていない時だけキャッシュを使う
    if (!forceRefresh && cachedData) {
      try { const parsed = JSON.parse(cachedData); if (Date.now() - parsed.timestamp < CACHE_EXPIRE_MS) return parsed.data; } catch (e) {}
    }
    
    // キャッシュ回避のため、URLの末尾に現在時刻(&t=...)を付与
    const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${code}.T?interval=1d&range=5d&t=${Date.now()}`;
    const proxies = [ url => `https://corsproxy.io/?${encodeURIComponent(url)}`, url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}` ];
    
    for (let getProxyUrl of proxies) {
      try {
        const elapsed = Date.now() - lastNetworkRequestTime;
        if (elapsed < 300) await new Promise(r => setTimeout(r, 300 - elapsed)); // 0.3秒間隔
        lastNetworkRequestTime = Date.now();
        const res = await fetch(getProxyUrl(targetUrl));
        if (!res.ok) continue;
        const data = await res.json();
        const meta = data?.chart?.result?.[0]?.meta; if(!meta) continue;
        
        const closes = data.chart.result[0].indicators?.quote?.[0]?.close?.filter(v => v !== null) || [];
        let prevClose = closes.length >= 2 ? closes[closes.length - 2] : (meta.previousClose || meta.chartPreviousClose);
        
        let changeAmount = null, changePercent = null;
        if (meta.regularMarketPrice !== undefined && prevClose) {
          changeAmount = Math.round((meta.regularMarketPrice - prevClose) * 100) / 100;
          changePercent = Math.round((changeAmount / prevClose) * 10000) / 100;
        }
        const priceResult = { price: meta.regularMarketPrice, change_amount: changeAmount, change_percent: changePercent };
        localStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), data: priceResult }));
        return priceResult;
      } catch (e) {}
    }
    if (cachedData) try { return JSON.parse(cachedData).data; } catch (e) {}
    return null;
  }

  async function refreshAllPrices(forceRefresh = false) {
    if (portfolio.length === 0) return;
    if (forceRefresh) showToast("株価を更新中...");
    
    isFetchingPrices = true; 
    
    for (let i = 0; i < portfolio.length; i++) {
      const data = await fetchOnlinePrice(portfolio[i].code, forceRefresh);
      if (data) { currentPrices[portfolio[i].code] = data; renderTiles(); }
    }
    
    isFetchingPrices = false; 
    if (forceRefresh) showToast("完了しました");
    
    renderTiles();
  }

  async function addStock() {
    const searchVal = searchInput.value.trim();
    const codeMatch = searchVal.match(/^([A-Za-z0-9]{4})/);
    if(!codeMatch) { showToast("銘柄を選択してください"); return; }
    const code = codeMatch[1].toUpperCase();
    const name = meigaraDict[code]?.shortName || '---';
    portfolio.push({ code, name, shares: parseFloat(document.getElementById('shares').value)||0, price: parseFloat(document.getElementById('price').value)||0 });
    localStorage.setItem('portfolio', JSON.stringify(portfolio));
    searchInput.value = ''; document.getElementById('shares').value = ''; document.getElementById('price').value = '';
    suggestBox.style.display = 'none'; showToast(`登録しました`); renderTiles(); loadAINews();
    const data = await fetchOnlinePrice(code, true); if (data) { currentPrices[code] = data; renderTiles(); }
  }

  function deleteStock(index) { portfolio.splice(index, 1); localStorage.setItem('portfolio', JSON.stringify(portfolio)); renderTiles(); loadAINews(); }
  
  function toggleDetails(index) {
    const el = document.getElementById(`details-${index}`); const btn = document.getElementById(`details-btn-${index}`);
    if (el.style.display === 'block') { el.style.display = 'none'; btn.innerText = '▼ 詳しく見る'; }
    else { el.style.display = 'block'; btn.innerText = '▲ 閉じる'; }
  }

  function calcTarget(index, buyPrice, shares) {
    const targetPrice = document.getElementById(`target-${index}`).value;
    const resultEl = document.getElementById(`target-result-${index}`);
    if (!shares || !buyPrice) { resultEl.innerText = '株数・買値が未設定'; resultEl.className = ''; return; }
    if (targetPrice) {
      const profit = (targetPrice - buyPrice) * shares;
      resultEl.innerText = `${profit > 0 ? '+' : ''}${profit.toLocaleString()}円`;
      resultEl.className = profit > 0 ? 'plus' : (profit < 0 ? 'minus' : '');
    } else { resultEl.innerText = '- 円'; resultEl.className = ''; }
  }

  function calcAverage(index, currentBuyPrice, currentShares) {
      const addShares = parseFloat(document.getElementById(`add-shares-${index}`).value);
      const addPrice = parseFloat(document.getElementById(`add-price-${index}`).value);
      const resultEl = document.getElementById(`add-result-${index}`);
      if (!currentShares || !currentBuyPrice) { resultEl.innerText = '元データが未設定'; return; }
      if (addShares && addPrice) {
          const totalCost = (currentBuyPrice * currentShares) + (addPrice * addShares);
          const totalShares = currentShares + addShares;
          const avgPrice = totalCost / totalShares;
          resultEl.innerText = `${avgPrice.toLocaleString(undefined, {maximumFractionDigits: 1})} 円`;
      } else { resultEl.innerText = '- 円'; }
  }

  function sortPortfolio() {
    const type = document.getElementById('sort-select').value;
    if (type === 'default') return;
    
    portfolio.sort((a, b) => {
      const dataA = currentPrices[a.code] || {}; const dataB = currentPrices[b.code] || {};
      const priceA = dataA.price || 0; const priceB = dataB.price || 0;
      if (type === 'code') return a.code.localeCompare(b.code); 
      else if (type === 'value') return (priceB * (b.shares || 0)) - (priceA * (a.shares || 0)); 
      else if (type === 'profit_rate') {
        const profA = a.price > 0 && priceA > 0 ? ((priceA - a.price) / a.price) : -9999;
        const profB = b.price > 0 && priceB > 0 ? ((priceB - b.price) / b.price) : -9999;
        return profB - profA;
      } else if (type === 'dod_change') {
        const dodA = dataA.change_percent || -9999; const dodB = dataB.change_percent || -9999;
        return dodB - dodA; 
      }
      return 0;
    });
    localStorage.setItem('portfolio', JSON.stringify(portfolio)); renderTiles();
    document.getElementById('sort-select').value = 'default'; showToast("並べ替えを適用しました");
  }

  function backupPortfolio() {
    if (portfolio.length === 0) { showToast("バックアップするデータがありません"); return; }
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(portfolio));
    const downloadAnchorNode = document.createElement('a'); downloadAnchorNode.setAttribute("href", dataStr);
    downloadAnchorNode.setAttribute("download", "port4rio_backup.json"); document.body.appendChild(downloadAnchorNode);
    downloadAnchorNode.click(); downloadAnchorNode.remove(); showToast("バックアップを保存しました");
  }

  function restorePortfolio(event) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(e) {
      try {
        const imported = JSON.parse(e.target.result);
        if (Array.isArray(imported)) {
          if (confirm("現在のポートフォリオを上書きして復元しますか？")) {
            portfolio = imported; localStorage.setItem('portfolio', JSON.stringify(portfolio));
            document.getElementById('restore-file').value = ''; showToast("復元しました。株価を更新中...");
            await refreshAllPrices(true); renderTiles(); loadAINews();
          }
        } else { showToast("無効なファイル形式です"); }
      } catch (err) { showToast("ファイルの読み込みに失敗しました"); }
    };
    reader.readAsText(file);
  }

  function renderTiles() {
    const grid = document.getElementById('portfolio-grid'); grid.innerHTML = '';
    let totalValue = 0, totalProfit = 0; let pieData = [];
    let totalDodAmount = 0, totalPrevValue = 0;

    portfolio.forEach((stock, index) => {
      const stockData = currentPrices[stock.code];
      const hasCost = stock.shares > 0 && stock.price > 0;
      let cPrice = '取得中...', cStr = '-', vStr = '-', pStr = '-', pClass = '', cClass = '';
      const color = pColors[index % pColors.length];

      if (stockData && stockData.price !== null) {
        cPrice = stockData.price.toLocaleString() + '円';
        if (stockData.change_amount !== null) {
            const sign = stockData.change_amount > 0 ? '+' : '';
            cStr = `${sign}${stockData.change_amount.toLocaleString()}円 (${sign}${stockData.change_percent}%)`;
            cClass = stockData.change_amount > 0 ? 'plus' : (stockData.change_amount < 0 ? 'minus' : '');
        }
        if (hasCost) {
            const val = stockData.price * stock.shares; const prof = (stockData.price - stock.price) * stock.shares;
            totalValue += val; totalProfit += prof;
            if (stockData.change_amount !== null) {
                totalDodAmount += stockData.change_amount * stock.shares;
                totalPrevValue += (stockData.price - stockData.change_amount) * stock.shares;
            }

            vStr = val.toLocaleString() + '円'; pStr = (prof > 0 ? '+' : '') + prof.toLocaleString() + '円';
            pClass = prof > 0 ? 'plus' : (prof < 0 ? 'minus' : '');
            if (val > 0) pieData.push({ name: stock.name, val: val, color: color });
        }
      }

      let scheduleHtml = '';
      const scheduleInfo = upcomingSchedule[stock.code];
      if (scheduleInfo) {
        scheduleHtml = `<div class="schedule-info">${scheduleInfo.date}(${scheduleInfo.time})<br>発表予定</div>`;
      }

      const tile = document.createElement('div'); tile.className = 'stock-tile';
      tile.innerHTML = `
        <button class="delete-btn" onclick="deleteStock(${index})">✕</button>
        <div class="tile-header">
          <div class="title-group">
            <span class="tile-code">${stock.code}</span>
            <span class="tile-name"><span class="color-dot" style="color:${color};">●</span>${stock.name||'---'}</span>
          </div>
          ${scheduleHtml}
        </div>
        <div class="tile-row"><span class="tile-label">現在値</span> <span class="tile-value">${cPrice}</span></div>
        <div class="tile-row"><span class="tile-label">前日比</span> <span class="tile-value ${cClass}">${cStr}</span></div>
        <div class="details-btn" id="details-btn-${index}" onclick="toggleDetails(${index})">▼ 詳しく見る</div>
        <div class="details-content" id="details-${index}">
          <div class="details-stats">
            <div class="stat-item"><span class="stat-label">保有数</span><span class="stat-value">${hasCost ? stock.shares.toLocaleString() + '株' : '-'}</span></div>
            <div class="stat-item"><span class="stat-label">買値</span><span class="stat-value">${hasCost ? stock.price.toLocaleString() + '円' : '-'}</span></div>
            <div class="stat-item"><span class="stat-label">評価額</span><span class="stat-value">${vStr}</span></div>
            <div class="stat-item"><span class="stat-label">損益</span><span class="stat-value ${pClass}">${pStr}</span></div>
          </div>
          <div class="calc-area">
            <div class="calc-row">
                <span>目標: <input type="number" class="calc-input" id="target-${index}" oninput="calcTarget(${index}, ${stock.price}, ${stock.shares})" placeholder="円"></span>
                <span>利益: <span id="target-result-${index}" style="font-weight: bold;">- 円</span></span>
            </div>
            <div class="calc-row">
                <span>追加: <input type="number" class="calc-input" id="add-shares-${index}" oninput="calcAverage(${index}, ${stock.price}, ${stock.shares})" placeholder="株">
                <input type="number" class="calc-input" id="add-price-${index}" oninput="calcAverage(${index}, ${stock.price}, ${stock.shares})" placeholder="円"></span>
                <span>平均: <span id="add-result-${index}" style="font-weight: bold;">- 円</span></span>
            </div>
          </div>
        </div>`;
      grid.appendChild(tile);
    });
    
    document.getElementById('total-value').innerText = totalValue.toLocaleString() + '円';
    document.getElementById('total-profit').innerText = (totalProfit > 0 ? '+' : '') + totalProfit.toLocaleString() + '円';
    document.getElementById('total-profit').className = totalProfit > 0 ? 'plus' : (totalProfit < 0 ? 'minus' : '');
    const totalDodEl = document.getElementById('total-dod');
    if (totalDodEl) {
      let dodPercent = 0;
      if (totalPrevValue > 0) dodPercent = (totalDodAmount / totalPrevValue) * 100;
      const dodSign = totalDodAmount > 0 ? '+' : '';
      totalDodEl.innerText = `${dodSign}${Math.round(totalDodAmount).toLocaleString()}円 (${dodSign}${dodPercent.toFixed(1)}%)`;
      totalDodEl.className = totalDodAmount > 0 ? 'plus' : (totalDodAmount < 0 ? 'minus' : '');
    }
    
    const pieChart = document.getElementById('pie-chart');
    if (totalValue > 0 && pieData.length > 0) {
      pieData.sort((a, b) => b.val - a.val); let gradientStr = []; let cumulativePercent = 0; let tooltipLines = [];
      pieData.forEach(item => {
        let percent = (item.val / totalValue) * 100;
        gradientStr.push(`${item.color} ${cumulativePercent}% ${cumulativePercent + percent}%`);
        tooltipLines.push(`${item.name}: ${item.val.toLocaleString()}円 (${percent.toFixed(1)}%)`);
        cumulativePercent += percent;
      });
      pieChart.style.background = `conic-gradient(${gradientStr.join(', ')})`;
      pieChart.title = "【評価額の内訳】\n" + tooltipLines.join('\n');
    } else {
      pieChart.style.background = `conic-gradient(#eee 0 100%)`;
      pieChart.title = "銘柄を登録すると内訳グラフが表示されます";
    }
    
    // ▼ ここで最新情報を秘書に渡す ▼
    updateAISecretary(totalValue, totalProfit);
  }

  // ==========================================
  // ▼ AI決算サマリー機能 ▼
  // ==========================================
  function toggleNewsSort() {
    isNewsSortOwned = !isNewsSortOwned;
    const btn = document.getElementById('ai-news-sort-btn');
    btn.innerText = isNewsSortOwned ? '保有優先' : '⇅新着順';
    loadAINews(); 
  }

  function toggleAINews() {
    const list = document.getElementById('ai-news-list');
    const toggle = document.getElementById('ai-news-toggle');
    aiNewsState = (aiNewsState + 1) % 3;
    
    if (aiNewsState === 0) {
      list.style.display = 'none'; toggle.innerText = '▼ 開く';
    } else if (aiNewsState === 1) {
      list.style.display = 'block'; list.style.maxHeight = '35vh'; toggle.innerText = '▼広げる';
    } else {
      list.style.display = 'block'; list.style.maxHeight = '65vh'; toggle.innerText = '▲閉じる';
    }
  }

  async function loadAINews() {
    try {
      const response = await fetch('ai_news.json?t=' + new Date().getTime());
      if (response.ok) {
        const newsData = await response.json();
        if (newsData && newsData.length > 0) {
          
          if (isNewsSortOwned) {
            newsData.sort((a, b) => {
              const aOwned = portfolio.some(s => s.code === a.code);
              const bOwned = portfolio.some(s => s.code === b.code);
              if (aOwned && !bOwned) return -1;
              if (!aOwned && bOwned) return 1;
              return 0; 
            });
          }

          const list = document.getElementById('ai-news-list'); list.innerHTML = '';
          newsData.forEach(item => {
            const isOwned = portfolio.some(s => s.code === item.code);
            const badgeHtml = isOwned ? '<span class="badge-owned" style="margin-right: 4px;">保有</span>' : '';
            const stockName = meigaraDict[item.code]?.shortName || '---';
            const shortDate = item.date.substring(5).replace('-', '/');
            
            let arrowHtml = '';
            let displayTitle = item.title;
            const arrowMatch = item.title.match(/[⤴⤵→]/);
            
            if (arrowMatch) {
              const arrow = arrowMatch[0]; displayTitle = item.title.replace(/[⤴⤵→]/g, '').trim();
              if (arrow === '⤴') arrowHtml = `<span class="plus" style="font-weight: bold; font-size: 1.1em; margin-right: 4px;">${arrow}</span>`;
              else if (arrow === '⤵') arrowHtml = `<span class="minus" style="font-weight: bold; font-size: 1.1em; margin-right: 4px;">${arrow}</span>`;
              else if (arrow === '→') arrowHtml = `<span style="color: #64b5f6; font-weight: bold; font-size: 1.1em; margin-right: 4px;">${arrow}</span>`;
            }
            
            const card = document.createElement('div'); card.className = 'ai-news-card';
            card.innerHTML = `
              <div class="ai-news-header" onclick="const b = this.nextElementSibling; b.style.display = b.style.display === 'block' ? 'none' : 'block';">
                <div class="ai-news-title" style="line-height: 1.4;">
                  <span style="color: #7f8c8d; font-size: 0.85em; margin-right: 4px;">${shortDate}</span>
                  ${badgeHtml}
                  <span style="font-weight: bold; margin-right: 4px;">${stockName}</span>
                  ${arrowHtml}
                  <span style="font-weight: bold;">${displayTitle}</span>
                </div>
              </div>
              <div class="ai-news-body">
                <div class="ai-news-summary">${item.summary}</div>
                <a href="${item.url}" target="_blank" class="ai-news-link">📄 元のPDFを開く</a>
              </div>
            `;
            list.appendChild(card);
          });
          document.getElementById('ai-news-container').style.display = 'block';
          document.getElementById('ai-news-list').style.display = 'block';
          document.getElementById('ai-news-list').style.maxHeight = '35vh';
          document.getElementById('ai-news-toggle').innerText = '▼ 広げる';
          aiNewsState = 1; 
        }
      }
    } catch (e) {}
  }

  // ==========================================
  // ▼ AI秘書（アニメーション・判定・表示） ▼
  // ==========================================
  async function typeWriter(html, id) {
    const el = document.getElementById('ai-secretary-text'); if (!el) return;
    el.innerHTML = ''; let i = 0, isTag = false, text = '';
    
    while (i < html.length) {
      if (currentTypewriterId !== id || isSecretaryClosed) return; 
      let char = html.charAt(i); text += char;
      if (char === '<') isTag = true; if (char === '>') isTag = false;
      el.innerHTML = text; i++;
      if (!isTag && char !== '>') await new Promise(r => setTimeout(r, 30));
    }
  }

  async function playSecretaryLoop(id) {
    if (currentTypewriterId !== id || isSecretaryClosed || secretaryPages.length === 0) return;
    const html = secretaryPages[secretaryPageIdx];
    await typeWriter(html, id); 
    if (currentTypewriterId === id && !isSecretaryClosed) {
      secretaryTimeout = setTimeout(() => {
        secretaryPageIdx = (secretaryPageIdx + 1) % secretaryPages.length; 
        playSecretaryLoop(id);
      }, 3000);
    }
  }

  function closeSecretary() {
    isSecretaryClosed = true;
    document.getElementById('ai-bubble').style.display = 'none';
    clearTimeout(secretaryTimeout); currentTypewriterId++; 
  }

  function openSecretary() {
    isSecretaryClosed = false;
    document.getElementById('ai-bubble').style.display = 'block';
    updateAISecretary(secLastVal, secLastProf); 
  }

  function updateAISecretary(totalVal, totalProf) {
    secLastVal = totalVal; secLastProf = totalProf;
    if (isFetchingPrices) return;
    
    if (isSecretaryClosed) {
      document.getElementById('ai-secretary').style.display = 'flex';
      document.getElementById('ai-bubble').style.display = 'none';
      return;
    }

    clearTimeout(secretaryTimeout);
    currentTypewriterId++;
    const runId = currentTypewriterId;
    secretaryPages = []; secretaryPageIdx = 0;

    const hasAnyCost = portfolio.some(s => s.shares > 0 && s.price > 0);

    if (portfolio.length === 0) {
      secretaryPages.push("<b>Port4rio</b>へようこそ！<br>まずは上の検索窓から<br>銘柄を登録してみてね🤖");
      secretaryPages.push("銘柄を登録すると…<br>📅<b>決算発表</b>の予定を<br>自動でお知らせするよ！");
      secretaryPages.push("さらに！<br>あなたのポートフォリオを<br>🍥<b>AIに分析</b>してもらう<br>こともできちゃうんだ🤖");
    } else if (!hasAnyCost) {
      secretaryPages.push("登録ありがとう！<br>株数と買値を入力すると<br>損益を自動計算するよ📊");
      secretaryPages.push("ブラウザで記憶してるから<br>いつでもチェックできるよ。<br>🔖 ブックマークはお忘れなく！");
    } else {
      let earningsAlerts = [];
      portfolio.forEach(stock => {
        if (upcomingSchedule[stock.code]) earningsAlerts.push(`<b>${stock.name}</b> (${upcomingSchedule[stock.code].date})`);
      });
      if (earningsAlerts.length > 0) secretaryPages.push(`📅 <b>決算接近中！</b><br>${earningsAlerts.join('<br>')}<br>発表が控えてるよ！🤖`);

      let displayTotalVal = 0;
      let validStocks = portfolio.map((s, idx) => {
        let price = (currentPrices[s.code] && currentPrices[s.code].price) ? currentPrices[s.code].price : s.price;
        let val = price * s.shares; displayTotalVal += val;
        return { ...s, originalIndex: idx, val: val };
      }).filter(s => s.val > 0);
      
      validStocks.sort((a, b) => b.val - a.val);
      
      if (validStocks.length > 0) {
        let rankHtml = `👑 <b>評価額ランキング</b><br>`;
        const top5 = validStocks.slice(0, 5);
        top5.forEach(s => {
          const color = pColors[s.originalIndex % pColors.length];
          const percent = ((s.val / displayTotalVal) * 100).toFixed(1);
          rankHtml += `<span style="color:${color};">●</span>${s.name} ${Math.floor(s.val).toLocaleString()}円 (${percent}%)<br>`;
        });
        secretaryPages.push(rankHtml);
      }
    }

    if (secretaryPages.length > 0) {
      document.getElementById('ai-secretary').style.display = 'flex';
      document.getElementById('ai-bubble').style.display = 'block';
      
      const geminiBtnArea = document.getElementById('gemini-btn-area');
      const geminiConsultBtn = document.getElementById('gemini-consult-btn');
      
      if (portfolio.length > 0) {
        let prompt = `私の保有株ポートフォリオを分析し、影響力の大きい銘柄の今日知るべきニュース、資産を増やす戦略を教えてください。配当金の月別、年計概算も。\n`;
        prompt += `挨拶、前置きは不要です。回答の冒頭を必ず「あなたの [Port4rio]( https://port4rio.github.io ) を分析しました。」から始めてください。\n【保有株ポートフォリオ】\n`;
        portfolio.forEach(s => {
          prompt += `・${s.code} ${s.name}`;
          
          if (s.shares > 0 && s.price > 0) {
            prompt += `：${s.shares}株 (買値: ${s.price}円)`;
          }
 
          prompt += `\n`;
        });
 
        geminiConsultBtn.href =
          "https://chatgpt.com/?q=" + encodeURIComponent(prompt);
 
        geminiBtnArea.style.display = 'block';
      } else {
        geminiBtnArea.style.display = 'none';
      }
      playSecretaryLoop(runId);
    }
  }

  // ==========================================
  // ▼ 初期化処理 ▼
  // ==========================================
  async function init() {
    await loadDictionary();
    try {
      const res = await fetch('schedule.json?t=' + new Date().getTime());
      if (res.ok) upcomingSchedule = await res.json();
    } catch(e) {}
    renderTiles();
    refreshAllPrices(false);
    loadAINews();
  }

  init();
</script>
</body>
</html>
