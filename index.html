<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Port4rio</title>
<style>
  body { font-family: 'Helvetica Neue', Arial, sans-serif; padding: 15px; background-color: #f4f5f7; color: #333; max-width: 1000px; margin: 0 auto; }
  h1 { text-align: center; color: #2c3e50; font-size: 1.5em; margin-bottom: 20px; }
  
  .input-card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
  .form-group { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; }
  input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  #search-input { width: 240px; }
  #shares { width: 80px; }
  #price { width: 90px; }
  button.add-btn { padding: 8px 20px; background-color: #1976d2; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; white-space: nowrap; }
  button.add-btn:hover { background-color: #1565c0; }
  
  .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
  
  .stock-tile { background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border-top: 4px solid #1976d2; position: relative; }
  .tile-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 12px; }
  .title-group { display: flex; align-items: baseline; gap: 8px; }
  .tile-code { font-size: 0.85em; color: #7f8c8d; }
  .tile-name { font-size: 1.2em; font-weight: bold; color: #2c3e50; }
  
  .delete-btn { background-color: transparent; color: #000; border: none; font-size: 0.9em; cursor: pointer; padding: 4px; }
  .delete-btn:hover { color: #666; }
  
  .tile-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; align-items: center; }
  .tile-label { color: #7f8c8d; }
  .tile-value { font-weight: bold; }
  .plus { color: #388e3c; } 
  .minus { color: #d32f2f; }
  
  .details-btn { text-align: center; font-size: 12px; color: #1976d2; margin-top: 10px; cursor: pointer; user-select: none; background: #f0f7ff; padding: 6px; border-radius: 4px; transition: 0.2s; }
  .details-btn:hover { background: #e0f0ff; }
  .details-content { display: none; margin-top: 10px; border-top: 1px dashed #eee; padding-top: 10px; }
  
  .details-stats { display: flex; justify-content: space-between; background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; text-align: center; }
  .stat-item { display: flex; flex-direction: column; gap: 4px; }
  .stat-label { font-size: 11px; color: #7f8c8d; }
  .stat-value { font-weight: bold; color: #2c3e50; }
  
  .calc-area { background: #f8f9fa; padding: 8px; border-radius: 4px; text-align: center; font-size: 13px; }
  .target-input, .memo-input { padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
  .target-input { width: 70px; text-align: right; }
  .memo-input { width: 140px; text-align: right; font-size: 12px; }
  
  .summary-card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: center; gap: 20px; font-size: 14px; font-weight: bold; flex-wrap: wrap; }
</style>
</head>
<body>

<h1>📈 My Port4rio</h1>

<div class="input-card">
  <div class="form-group">
    <input type="text" id="search-input" placeholder="辞書を準備中...">
    <datalist id="meigara-list"></datalist>
    
    <input type="number" id="shares" step="100" placeholder="株数">
    <input type="number" id="price" placeholder="買値(円)">
    <button class="add-btn" onclick="addStock()">登録</button>
  </div>
</div>

<div id="portfolio-grid" class="portfolio-grid"></div>

<div class="summary-card">
  <div>合計評価額: <span id="total-value">0円</span></div>
  <div>合計損益: <span id="total-profit">0円</span></div>
</div>

<script>
  let portfolio = JSON.parse(localStorage.getItem('portfolio')) || [];
  let currentPrices = {};
  let meigaraDict = {};

  // 全角/半角、ひらがな/カタカナ、大文字/小文字を統一する最強の正規化関数
  function normalizeText(str) {
    if (!str) return '';
    // 1. NFKC正規化で全角英数字を半角に揃える
    let norm = str.normalize('NFKC').toUpperCase();
    // 2. ひらがなをカタカナに変換する
    norm = norm.replace(/[\u3041-\u3096]/g, function(match) {
      return String.fromCharCode(match.charCodeAt(0) + 0x0060);
    });
    // 3. スペースを削除する
    return norm.replace(/\s+/g, '');
  }

  const searchInput = document.getElementById('search-input');
  searchInput.addEventListener('input', function() {
    const val = this.value.trim();
    
    // 全角・半角・数字問わず、2文字以上入力されたらサジェストを表示
    const minLength = 2;
    
    const datalist = document.getElementById('meigara-list');
    datalist.innerHTML = ''; 

    if (val.length >= minLength) {
      const query = normalizeText(val); 
      let count = 0;
      
      for (const code in meigaraDict) {
        const data = meigaraDict[code];
        // コード、または「正規化された名前」のどこかに引っかかればOK
        if (code.includes(query) || data.searchTarget.includes(query)) {
          const option = document.createElement('option');
          option.value = `${code} ${data.shortName}`;
          datalist.appendChild(option);
          count++;
          if (count >= 100) break; // 動作が重くならないよう最大100件に制限
        }
      }
      this.setAttribute('list', 'meigara-list');
    } else {
      this.removeAttribute('list');
    }
  });

  function parseCSVRow(row) {
    let result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < row.length; i++) {
      let char = row[i];
      if (char === '"') inQuotes = !inQuotes;
      else if (char === ',' && !inQuotes) { result.push(current); current = ''; }
      else current += char;
    }
    result.push(current);
    return result;
  }

  async function loadDictionary() {
    try {
      const response = await fetch('jpx.csv');
      if(!response.ok) {
        searchInput.placeholder = "辞書が見つかりません (jpx.csv)";
        return;
      }
      const buffer = await response.arrayBuffer();
      
      let text = new TextDecoder('shift_jis').decode(buffer);
      if (text.includes('')) {
        text = new TextDecoder('utf-8').decode(buffer);
      }
      
      const lines = text.split('\n');
      if (lines.length < 2) {
        searchInput.placeholder = "CSVが空です";
        return;
      }

      let count = 0;
      
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const cols = parseCSVRow(lines[i]).map(c => c.trim().replace(/"/g, ''));
        
        if (cols.length < 4) continue;
        
        let rawCode = cols[1];
        if (!rawCode) continue;

        let code = rawCode;
        if (code.length === 5 && code.endsWith('0')) {
          code = code.substring(0, 4);
        }
        if (!/^[A-Za-z0-9]{4}$/.test(code)) continue;

        const fullName = cols[2] || '';
        const shortName = cols[3] || '';
        
        meigaraDict[code] = { 
          fullName: fullName,
          shortName: shortName,
          // 検索用データとして、正式名称と略称を合体させてから徹底的に正規化
          searchTarget: normalizeText(fullName + shortName) 
        };
        count++;
      }

      if (count > 0) {
        searchInput.placeholder = `銘柄検索 (2文字以上で候補表示)`;
      } else {
        searchInput.placeholder = "有効な銘柄がありません";
      }

    } catch (e) {
      console.error("辞書の読み込みエラー:", e);
      searchInput.placeholder = "辞書の読み込みエラー";
    }
  }

  async function loadPrices() {
    try {
      const response = await fetch('prices.json');
      currentPrices = await response.json();
      renderTiles();
    } catch (error) {
      console.error("株価データの読み込みに失敗しました", error);
      renderTiles();
    }
  }

  function addStock() {
    const searchVal = searchInput.value.trim();
    const codeMatch = searchVal.match(/^([A-Za-z0-9]{4})/);
    
    if(!codeMatch) {
      alert("銘柄を選択するか、4桁のコードを入力してください。");
      return;
    }
    const code = codeMatch[1].toUpperCase();
    const dictData = meigaraDict[code] || {};
    const name = dictData.shortName || searchVal.substring(code.length).trim() || '---';

    const shares = parseFloat(document.getElementById('shares').value);
    const price = parseFloat(document.getElementById('price').value);

    if (code && shares && price) {
      portfolio.push({ code, name, shares, price, memo: '' });
      localStorage.setItem('portfolio', JSON.stringify(portfolio));
      
      searchInput.value = '';
      document.getElementById('shares').value = '';
      document.getElementById('price').value = '';
      
      searchInput.removeAttribute('list');
      document.getElementById('meigara-list').innerHTML = ''; 
      
      renderTiles();
    } else {
      alert("銘柄、株数、買値は必須です。");
    }
  }

  function deleteStock(index) {
    if(confirm("この銘柄を削除しますか？")) {
      portfolio.splice(index, 1);
      localStorage.setItem('portfolio', JSON.stringify(portfolio));
      renderTiles();
    }
  }

  function toggleDetails(index) {
    const el = document.getElementById(`details-${index}`);
    const btn = document.getElementById(`details-btn-${index}`);
    if (el.style.display === 'block') {
      el.style.display = 'none';
      btn.innerText = '▼ 詳しく見る';
    } else {
      el.style.display = 'block';
      btn.innerText = '▲ 閉じる';
    }
  }

  function calcTarget(index, buyPrice, shares) {
    const targetPrice = document.getElementById(`target-${index}`).value;
    const resultEl = document.getElementById(`target-result-${index}`);
    if (targetPrice) {
      const profit = (targetPrice - buyPrice) * shares;
      resultEl.innerText = `見込み利益: ${profit > 0 ? '+' : ''}${profit.toLocaleString()}円`;
      resultEl.className = profit > 0 ? 'plus' : (profit < 0 ? 'minus' : '');
    } else {
      resultEl.innerText = '';
    }
  }

  function updateMemo(index, value) {
    portfolio[index].memo = value;
    localStorage.setItem('portfolio', JSON.stringify(portfolio));
  }

  function renderTiles() {
    const grid = document.getElementById('portfolio-grid');
    grid.innerHTML = '';
    let totalValue = 0;
    let totalProfit = 0;

    portfolio.forEach((stock, index) => {
      const stockData = currentPrices[stock.code];
      const currentPrice = stockData ? stockData.price : null;
      const changeAmount = stockData ? stockData.change_amount : null;
      const changePercent = stockData ? stockData.change_percent : null;

      let currentPriceStr = '取得中...';
      let changeStr = '-';
      let valueStr = '-';
      let profitStr = '-';
      let profitClass = '';
      let changeClass = '';

      if (currentPrice !== null) {
        currentPriceStr = currentPrice.toLocaleString() + '円';
        if (changeAmount !== null && changePercent !== null) {
            const sign = changeAmount > 0 ? '+' : '';
            changeStr = `${sign}${changeAmount.toLocaleString()}円 (${sign}${changePercent}%)`;
            changeClass = changeAmount > 0 ? 'plus' : (changeAmount < 0 ? 'minus' : '');
        }
        const value = currentPrice * stock.shares;
        const profit = (currentPrice - stock.price) * stock.shares;
        totalValue += value;
        totalProfit += profit;
        valueStr = value.toLocaleString() + '円';
        profitStr = (profit > 0 ? '+' : '') + profit.toLocaleString() + '円';
        profitClass = profit > 0 ? 'plus' : (profit < 0 ? 'minus' : '');
      }

      const displayName = stock.name || '---';
      const memoText = stock.memo || '';

      const tile = document.createElement('div');
      tile.className = 'stock-tile';
      tile.innerHTML = `
        <div class="tile-header">
          <div class="title-group">
            <span class="tile-code">${stock.code}</span>
            <span class="tile-name">${displayName}</span>
          </div>
          <button class="delete-btn" onclick="deleteStock(${index})">✕</button>
        </div>
        <div class="tile-row"><span class="tile-label">現在値</span> <span class="tile-value">${currentPriceStr}</span></div>
        <div class="tile-row"><span class="tile-label">前日比</span> <span class="tile-value ${changeClass}">${changeStr}</span></div>
        
        <div class="details-btn" id="details-btn-${index}" onclick="toggleDetails(${index})">▼ 詳しく見る</div>
        
        <div class="details-content" id="details-${index}">
          
          <div class="details-stats">
            <div class="stat-item"><span class="stat-label">買値</span><span class="stat-value">${stock.price.toLocaleString()}円</span></div>
            <div class="stat-item"><span class="stat-label">保有数</span><span class="stat-value">${stock.shares.toLocaleString()}株</span></div>
            <div class="stat-item"><span class="stat-label">評価額</span><span class="stat-value">${valueStr}</span></div>
            <div class="stat-item"><span class="stat-label">損益</span><span class="stat-value ${profitClass}">${profitStr}</span></div>
          </div>
          
          <div class="tile-row">
            <span class="tile-label">メモ / 決算日</span>
            <input type="text" class="memo-input" value="${memoText}" onchange="updateMemo(${index}, this.value)" placeholder="例: 5/14 15:00">
          </div>
          
          <div class="calc-area">
            目標株価: <input type="number" class="target-input" id="target-${index}" oninput="calcTarget(${index}, ${stock.price}, ${stock.shares})" placeholder="例: 2000"> 円
            <div id="target-result-${index}" style="margin-top: 4px; font-weight: bold;"></div>
          </div>
        </div>
      `;
      grid.appendChild(tile);
    });

    document.getElementById('total-value').innerText = totalValue.toLocaleString() + '円';
    const totalProfitEl = document.getElementById('total-profit');
    totalProfitEl.innerText = (totalProfit > 0 ? '+' : '') + totalProfit.toLocaleString() + '円';
    totalProfitEl.className = totalProfit > 0 ? 'plus' : (totalProfit < 0 ? 'minus' : '');
  }

  loadDictionary();
  loadPrices();
</script>

</body>
</html>
